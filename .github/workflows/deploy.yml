name: Deploy

# Deploys main. Runs automatically after the CI workflow succeeded for a push to
# main, but only if the repository variable DEPLOY_ENABLED is 'true'
# (Settings > Variables). Can always be started manually.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only a green CI run of a push to main deploys; red or PR runs never do.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      # Optional: public URL for the final external health check, e.g. https://api.example.org
      DEPLOY_PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Deploy exactly the commit CI tested, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: Build static linux/amd64 binary
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/api" ./cmd/api

      - name: Configure SSH
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/api" "$DEPLOY_USER@$DEPLOY_HOST:/opt/reiterhof/api.new"

      - name: Swap binary, restart service, check health
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < deploy/remote-swap.sh

      - name: Check public health endpoint
        if: env.DEPLOY_PUBLIC_URL != ''
        run: curl -fsS --max-time 10 --retry 5 --retry-delay 3 "${DEPLOY_PUBLIC_URL%/}/healthz"
