# PostgreSQL 16 tuning for a 2 vCore / 2 GB RAM VPS that also runs the API and Caddy.
# Installed to /etc/postgresql/16/main/conf.d/reiterhof.conf by provision.sh.
# Budget: ~1 GB for PostgreSQL, the rest for the API (<= 1 GB), Caddy and the OS.

# --- Connections ---
listen_addresses = 'localhost'      # never expose the database to the network
max_connections = 30                # the API uses a small pool; each backend costs memory
password_encryption = scram-sha-256

# --- Memory ---
shared_buffers = 256MB              # ~12% of RAM (conservative because RAM is shared)
effective_cache_size = 768MB        # planner hint: what the OS page cache can realistically hold
work_mem = 8MB                      # per sort/hash node and connection; 30 * 8 MB stays bounded
maintenance_work_mem = 64MB         # VACUUM, CREATE INDEX
huge_pages = off

# --- WAL and checkpoints ---
wal_compression = on
min_wal_size = 128MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# --- SSD storage ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Planner ---
jit = off                           # JIT only adds latency for small OLTP queries

# --- Logging ---
log_min_duration_statement = 500ms  # log slow queries
log_line_prefix = '%m [%p] %u@%d '
log_checkpoints = on
log_lock_waits = on
