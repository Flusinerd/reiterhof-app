# PostgreSQL 16 tuning for a 4 GB RAM VPS that also runs the API and Caddy.
# Installed to /etc/postgresql/16/main/conf.d/reiterhof.conf by provision.sh.
# Budget: ~1.5 GB for PostgreSQL (shared buffers plus per-connection memory), the rest
# for the API, Caddy, backups and the OS page cache.

# --- Connections ---
listen_addresses = 'localhost'      # never expose the database to the network
max_connections = 30                # the API uses a small pool; each backend costs memory
password_encryption = scram-sha-256

# --- Memory ---
shared_buffers = 1GB                # 25% of RAM, the usual starting point
effective_cache_size = 2560MB       # planner hint: shared buffers plus the OS page cache
work_mem = 16MB                     # per sort/hash node and connection; 30 * 16 MB stays bounded
maintenance_work_mem = 256MB        # VACUUM, CREATE INDEX
huge_pages = off

# --- WAL and checkpoints ---
wal_compression = on
min_wal_size = 128MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9

# --- SSD storage ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Planner ---
jit = off                           # JIT only adds latency for small OLTP queries

# --- Logging ---
log_min_duration_statement = 500ms  # log slow queries
log_line_prefix = '%m [%p] %u@%d '
log_checkpoints = on
log_lock_waits = on
