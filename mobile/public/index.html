<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      HTML shell of the PWA. `web.output` is "single" (SPA), where Expo uses this file instead of
      app/+html.tsx (which only static rendering reads). `%LANG_ISO_CODE%` and `%WEB_TITLE%` come
      from app.json (`expo.web.lang`, `expo.name`); Expo appends the script and CSS links and the
      theme-color meta (`expo.web.themeColor`).

      - viewport-fit=cover: use the whole screen on an iPhone with a notch. The screens pad the
        safe area themselves (react-native-safe-area-context reads env(safe-area-inset-*)).
      - apple-mobile-web-app-*: "Zum Home-Bildschirm" installs it as a standalone app without
        Safari bars. "default" keeps the status bar readable on the light background.
      - manifest, icons: see public/manifest.webmanifest and scripts/gen-icons.mjs.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Anwesenheit, Decken, Anfragen, Pferdeakte und Training für die Stallgasse." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stallfunk" />
    <meta name="format-detection" content="telephone=no" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /* The first thing an installed app shows is this background: it is the "splash screen". */
        background-color: #f6f4ee;
        color: #1c1917;
      }
      /* The screens scroll themselves (ScrollView), not the body. */
      body {
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Stallfunk braucht JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
